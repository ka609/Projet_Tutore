name: medishop
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ----------- API & RÉSEAU -----------
  http: ^1.2.2              # Appels API simples
  dio: ^5.7.0               # Upload + downloads rapides (images, prescriptions)

  # ----------- STATE MANAGEMENT -------
  provider: ^6.1.2          # Pour AuthProvider, OrderProvider, etc.

  # ----------- STOCKAGE LOCAL ---------
  shared_preferences: ^2.3.2  # Token, userId, pharmacieId...

  # ----------- IMAGES & FICHIERS ------
  image_picker: ^1.1.2      # Sélection galerie / caméra
  file_picker: ^8.1.3       # Upload PDF / ordonnances...
  cached_network_image: ^3.4.1  # Chargement efficace des images

  # ----------- LOCALISATION -----------
  #geolocator_android: ^5.0.2
  #geolocator: ^14.0.2       # Localisation du livreur / client / pharmacie
  geocoding: ^3.0.0         # Convertir lat/lng → adresse
  google_maps_flutter: ^2.7.0 # Si tu veux afficher une map

  # ----------- UTILITAIRES -----------
  intl: ^0.19.0              # Format date / monnaie
  uuid: ^4.4.0               # Génération d'id uniques
  flutter_dotenv: ^5.1.0     # Fichier .env

  # ----------- UI / FORMULAIRES -------
  google_fonts: ^6.2.1       # Police modernes
  flutter_form_builder: ^9.2.1  # FormBuilder pro

  # ----------- NOTIFICATIONS ----------
  firebase_core: ^3.5.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.2.2
  flutter_secure_storage: ^9.0.0
  go_router: ^14.2.0

  # ----------- PAIEMENT / WEBVIEW -----
  webview_flutter: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    

  
