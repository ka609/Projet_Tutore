plugins {
    id "com.android.application"
    id "kotlin-android"
    // Flutter plugin (must come after Android + Kotlin)
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.medishop"

    // FIX : ne pas utiliser flutter.compileSdkVersion, mettre manuellement 35
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.example.medishop"

        // FIX : minSdk / targetSdk en dur (Flutter peut mal les détecter)
        minSdk = 21
        targetSdk = 35

        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
